<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vocational English vocabulary trainer for VG1 Helse- og oppvekstfag.">
  <title>Vocational English | Lukas VGS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --app-bg: #f5f7fb;
      --app-card: #ffffff;
      --app-text: #172033;
      --app-muted: #667085;
      --app-border: #e4e7ec;
      --app-success: #198754;
      --app-danger: #dc3545;
    }

    html, body { min-height: 100%; }
    body {
      background: var(--app-bg);
      color: var(--app-text);
    }

    .app-shell { max-width: 980px; }
    .trainer-shell { max-width: 760px; }
    .app-card {
      background: var(--app-card);
      border: 1px solid var(--app-border);
      border-radius: 1.1rem;
      box-shadow: 0 0.35rem 1.2rem rgba(16, 24, 40, 0.05);
    }
    .module-card {
      border-top: .35rem solid var(--module-accent, var(--bs-primary));
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 .6rem 1.4rem rgba(16, 24, 40, 0.08);
    }
    .quick-action {
      min-height: 86px;
      text-align: left;
    }
    .question-prompt {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      line-height: 1.16;
      letter-spacing: -0.02em;
    }
    .question-context {
      color: var(--app-muted);
      font-size: 1rem;
      line-height: 1.55;
    }
    .answer-input {
      font-size: 1.25rem;
      padding: .9rem 1rem;
    }
    .feedback-box {
      min-height: 92px;
      border-radius: .9rem;
    }
    .feedback-correct { background: #eaf7ef; border: 1px solid #b9e2c7; }
    .feedback-wrong { background: #fff0f1; border: 1px solid #f2c2c6; }
    .feedback-info { background: #eef5ff; border: 1px solid #c9dcff; }
    .last-five span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      background: #d0d5dd;
    }
    .last-five .ok { background: var(--app-success); }
    .last-five .bad { background: var(--app-danger); }
    .last-five .typo { background: #e0a800; }
    .progress { height: .65rem; }
    .small-caps { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
    .star-btn { min-width: 48px; }
    .choice-btn { white-space: normal; text-align: left; }
    .celebration {
      animation: popIn .35s ease both;
      font-weight: 700;
    }
    @keyframes popIn {
      0% { transform: scale(.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .classroom-mode .trainer-shell { max-width: 1120px; }
    .classroom-mode .question-prompt { font-size: clamp(2.8rem, 7vw, 5.2rem); }
    .classroom-mode .answer-input { font-size: 2rem; padding: 1.2rem 1.3rem; }
    .classroom-mode .personal-only { display: none !important; }
    .kbd-hint kbd { font-size: .75rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="container app-shell py-4 py-md-5" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script src="train-easter-egg.js?v=2"></script>
</body>
</html>
