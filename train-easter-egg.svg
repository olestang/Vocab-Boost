<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" role="img" aria-label="">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#0b7285"/>
      <stop offset="1" stop-color="#1098ad"/>
    </linearGradient>
  </defs>

  <!-- Top-down locomotive. Its nose points right so it can rotate naturally
       to follow the route without ever appearing upside-down. -->
  <g stroke="#172033" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- coupler -->
    <path d="M19 60H5M12 51v18" fill="none"/>

    <!-- side wheels -->
    <rect x="54" y="10" width="34" height="18" rx="8" fill="#343a40"/>
    <rect x="103" y="10" width="34" height="18" rx="8" fill="#343a40"/>
    <rect x="54" y="92" width="34" height="18" rx="8" fill="#343a40"/>
    <rect x="103" y="92" width="34" height="18" rx="8" fill="#343a40"/>

    <!-- main body and cab -->
    <path d="M25 32h150v56H25z" fill="url(#body)"/>
    <path d="M175 25h57l48 35-48 35h-57z" fill="#12b886"/>

    <!-- cab roof / windows -->
    <rect x="48" y="42" width="73" height="36" rx="7" fill="#f59f00"/>
    <rect x="58" y="49" width="24" height="22" rx="4" fill="#dff7ff" stroke-width="3"/>
    <rect x="89" y="49" width="22" height="22" rx="4" fill="#dff7ff" stroke-width="3"/>

    <!-- boiler details viewed from above -->
    <circle cx="152" cy="60" r="14" fill="#495057"/>
    <circle cx="152" cy="60" r="6" fill="#868e96" stroke="none"/>
    <path d="M194 43h28M194 77h28" fill="none" opacity="0.55"/>

    <!-- front lamp -->
    <circle cx="263" cy="60" r="8" fill="#ffe066" stroke="#f59f00" stroke-width="3"/>
  </g>
</svg>
